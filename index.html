<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PeerJS P2P Chat Room</title>
    <link rel="stylesheet" href="style.css?v=5">

    <!-- PeerJS client -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <!-- QRCode generator library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <main>
        <h1>PeerJS P2P Chat Room</h1>

        <p id="status">Connecting to PeerJS Cloud...</p>

        <div class="ping-bar">
            <div class="ping-item">
                <span class="ping-label">Relay / Room Ping (P2P):</span>
                <code id="player-ping" class="ping-value">-- ms</code>
            </div>
            <div class="ping-item">
                <span class="ping-label">Server Ping (PeerJS):</span>
                <code id="server-ping" class="ping-value">-- ms</code>
            </div>
        </div>

        <section>
            <h2>Your Nickname</h2>
            <div class="inline-row">
                <input id="username" placeholder="Enter your nickname...">
                <button id="save-username">Set Name</button>
            </div>
        </section>

        <section>
            <h2>Your Peer ID</h2>
            <code id="my-id">Connecting...</code>
            <br><br>
            <button id="copy-id">Copy ID</button>
            <button id="copy-invite">Copy Invite Link</button>
            <button id="show-qr">Show QR Code</button>
        </section>

        <section>
            <h2>Join Specific Host (Optional)</h2>
            <input id="remote-id" placeholder="Auto-connects to first user (or paste host ID)">
            <button id="connect">Join</button>
            <button id="new-room" class="secondary-btn">Create New Room</button>
        </section>

        <section>
            <h2>Room Users (<span id="user-count">1</span>)</h2>
            <ul id="user-list"></ul>
        </section>

        <section>
            <h2>Chat</h2>
            <div id="queue-status"></div>
            <div id="messages"></div>
            <input id="message" placeholder="Write a message...">
            <button id="send">Send</button>
        </section>
    </main>

    <!-- QR Code Modal Dialog -->
    <div id="qr-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Scan to Connect</h3>
            <p>Scan with another device to connect:</p>
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
            <p id="qr-url-text"></p>
            <button id="close-qr" class="secondary-btn">Close</button>
        </div>
    </div>

    <script src="script.js?v=6"></script>
</body>
</html>
